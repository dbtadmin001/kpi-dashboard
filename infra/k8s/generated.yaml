apiVersion: v1
kind: Service
metadata:
  name: nda-keycloak
  namespace: nda-platform
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8180
    targetPort: 8180
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: nda-platform
spec:
  selector:
    matchLabels:
      app: keycloak
  maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: nda-pipeline
  labels:
    app: opa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
      - name: opa
        image: openpolicyagent/opa:1.20.2@sha256:7b15f9d96345dfa639322ad97f65a0b38260f95efcdd7f5c24e284228708f06c
        args:
        - run
        - --server
        - --addr=0.0.0.0:8181
        - --log-level=error
        - /policy/authz.rego
        - /policy/data.json
        ports:
        - containerPort: 8181
        volumeMounts:
        - name: policy
          mountPath: /policy
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
      terminationGracePeriodSeconds: 60
      volumes:
      - name: policy
        configMap:
          name: opa-policy
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: opa
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: nda-pipeline
spec:
  selector:
    app: opa
  ports:
  - name: http
    port: 8181
    targetPort: 8181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: nda-platform
  labels:
    app: trino-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino-coordinator
  template:
    metadata:
      labels:
        app: trino-coordinator
    spec:
      containers:
      - name: trino
        image: trinodb/trino:455@sha256:cb08dfd4bd58fb4bec5df09457347c6f353f82d91495305e7648b2bf1307de45
        ports:
        - containerPort: 8443
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/trino
          subPath: trino
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 3Gi
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
          httpGet:
            path: /v1/info
            port: 8443
            scheme: HTTPS
        livenessProbe:
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /v1/info
            port: 8443
            scheme: HTTPS
      - name: identity
        image: nda-app:UNBUILT
        command:
        - python
        - -m
        - marketplace.identity
        - watch
        - --interval
        - '30'
        env: &id001
        - name: MARKETPLACE_RUNTIME_DIR
          value: /etc/marketplace
        - name: MARKETPLACE_OIDC_FILE
          value: /etc/marketplace/trino_oidc.json
        - name: MARKETPLACE_CREDENTIALS_FILE
          value: /etc/marketplace/credentials.json
        - name: MARKETPLACE_CA_FILE
          value: /etc/marketplace/trino/tls/marketplace-ca.crt
        - name: MARKETPLACE_TRINO_HOST
          value: trino.nda-platform.svc
        - name: KEYCLOAK_URL
          value: http://nda-keycloak.nda-platform.svc:8180
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: AUDIT_INGEST_URI
          value: http://audit.nda-pipeline.svc:8099/v1/query-events
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: KEYCLOAK_ADMIN_PASSWORD
        volumeMounts: &id002
        - name: config
          mountPath: /etc/marketplace
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: render-config
        image: nda-app:UNBUILT
        command:
        - sh
        - -c
        - python -m marketplace.tls issue && python -m marketplace.trino_config write
        env: *id001
        volumeMounts: *id002
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 100m
            memory: 256Mi
      volumes:
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: nda-platform
spec:
  selector:
    app: trino-coordinator
  ports:
  - name: https
    port: 8443
    targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: trino-marketplace
  namespace: nda-platform
spec:
  selector:
    app: trino-coordinator
  ports:
  - name: https
    port: 8443
    targetPort: 8443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-worker
  namespace: nda-platform
data:
  config.properties: 'coordinator=false

    http-server.http.port=8080

    discovery.uri=http://trino-discovery.nda-platform.svc:8080

    query.max-memory=4GB

    query.max-memory-per-node=1GB

    '
  node.properties: 'node.environment=marketplace

    '
  jvm.config: '-server

    -Xmx2G

    -XX:+UseG1GC

    -XX:G1HeapRegionSize=32M

    -XX:+ExitOnOutOfMemoryError

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  namespace: nda-platform
  labels:
    app: trino-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trino-worker
  template:
    metadata:
      labels:
        app: trino-worker
    spec:
      containers:
      - name: trino
        image: trinodb/trino:455@sha256:cb08dfd4bd58fb4bec5df09457347c6f353f82d91495305e7648b2bf1307de45
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/trino/config.properties
          subPath: config.properties
        - name: config
          mountPath: /etc/trino/node.properties
          subPath: node.properties
        - name: config
          mountPath: /etc/trino/jvm.config
          subPath: jvm.config
        - name: catalog
          mountPath: /etc/trino/catalog
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 3Gi
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
          httpGet:
            path: /v1/info
            port: 8080
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /v1/info
            port: 8080
            scheme: HTTP
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: render-catalog
        image: nda-app:UNBUILT
        command:
        - sh
        - -c
        - python -m marketplace.trino_config write && cp /etc/marketplace/trino/catalog/*.properties
          /catalog/
        env:
        - name: MARKETPLACE_RUNTIME_DIR
          value: /etc/marketplace
        - name: MARKETPLACE_OIDC_FILE
          value: /etc/marketplace/trino_oidc.json
