apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flink-jobmanager
  namespace: nda-pipeline
  labels:
    app: flink-jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-jobmanager
  template:
    metadata:
      labels:
        app: flink-jobmanager
    spec:
      containers:
      - name: jobmanager
        image: flink:1.20.1-scala_2.12-java17@sha256:d51a693da76581f2483d3f83d5997d3226b076a9f990a7f7d1eed144434b8e1e
        args:
        - jobmanager
        ports:
        - containerPort: 8081
        - containerPort: 6123
        env:
        - name: FLINK_PROPERTIES
          value: 'jobmanager.rpc.address: flink-jobmanager.nda-pipeline.svc

            jobmanager.memory.process.size: 1024m

            taskmanager.memory.process.size: 5120m

            taskmanager.numberOfTaskSlots: 2

            taskmanager.memory.managed.fraction: 0.1

            parallelism.default: 1

            state.backend.type: rocksdb

            state.checkpoints.dir: file:///opt/flink/state/checkpoints

            state.savepoints.dir: file:///opt/flink/state/savepoints

            execution.checkpointing.interval: 60s

            execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION'
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
        - name: state
          mountPath: /opt/flink/state
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1400Mi
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /overview
            port: 8081
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /overview
            port: 8081
            scheme: HTTP
      terminationGracePeriodSeconds: 60
  serviceName: flink-jobmanager
  podManagementPolicy: Parallel
  volumeClaimTemplates:
  - metadata:
      name: state
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: nda-local
      resources:
        requests:
          storage: 20Gi
