apiVersion: v1
kind: Namespace
metadata:
  name: nda-platform
  labels:
    nda.io/layer: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: nda-pipeline
  labels:
    nda.io/layer: pipeline
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nda-local
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nda-platform
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: nda
        - name: POSTGRES_DB
          value: nda
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          exec:
            command:
            - sh
            - -c
            - pg_isready -U nda -d nda
        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          exec:
            command:
            - sh
            - -c
            - pg_isready -U nda -d nda
      terminationGracePeriodSeconds: 60
  serviceName: postgres
  podManagementPolicy: Parallel
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: nda-local
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nda-platform
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: nda-platform
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        command:
        - server
        - --console-address
        - :9001
        - /data
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: MINIO_ROOT_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /minio/health/ready
            port: 9000
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /minio/health/live
            port: 9000
            scheme: HTTP
      terminationGracePeriodSeconds: 60
      nodeSelector:
        nda.io/storage: 'true'
  serviceName: minio-headless
  podManagementPolicy: Parallel
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: nda-local
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: nda-platform
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: nda-platform
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: nda-platform
  labels:
    app: kafka
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.10@sha256:6d627e3ebdc05438d1e8e3b55695ac1a7a0f79e7d5ca90b3b0f12dc984633e83
        command:
        - redpanda
        - start
        - --smp=1
        - --memory=768M
        - --reserve-memory=0M
        - --overprovisioned
        - --check=false
        - --kafka-addr=0.0.0.0:9092
        - --advertise-kafka-addr=$(POD_NAME).kafka-headless.nda-platform.svc.cluster.local:9092
        - --seeds=kafka-0.kafka-headless.nda-platform.svc.cluster.local:33145
        ports:
        - containerPort: 9092
        - containerPort: 9644
        - containerPort: 33145
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1500Mi
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /v1/status/ready
            port: 9644
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /v1/status/ready
            port: 9644
            scheme: HTTP
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: kafka
  serviceName: kafka-headless
  podManagementPolicy: Parallel
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: nda-local
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: nda-platform
spec:
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: admin
    port: 9644
    targetPort: 9644
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: nda-platform
spec:
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: rpc
    port: 33145
    targetPort: 33145
  clusterIP: None
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: nda-platform
spec:
  selector:
    matchLabels:
      app: kafka
  minAvailable: 2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: nda-pipeline
  labels:
    app: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04@sha256:ea73825f3d88a23c355ac2f9fdc6bd960fec90171c12c572109b36a558f77bb8
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: 'Y'
        - name: MSSQL_PID
          value: Developer
        - name: MSSQL_AGENT_ENABLED
          value: 'true'
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: MSSQL_SA_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 3Gi
        readinessProbe:
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 20
          timeoutSeconds: 5
          exec:
            command:
            - sh
            - -c
            - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD"
              -Q 'SELECT 1'
      terminationGracePeriodSeconds: 60
  serviceName: sqlserver
  podManagementPolicy: Parallel
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: nda-local
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: nda-pipeline
spec:
  selector:
    app: sqlserver
  ports:
  - name: mssql
    port: 1433
    targetPort: 1433
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: nda-platform
  labels:
    app: iceberg-rest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      containers:
      - name: catalog
        image: nda-catalog:UNBUILT
        ports:
        - containerPort: 8181
        env:
        - name: CATALOG_CATALOG__IMPL
          value: org.apache.iceberg.jdbc.JdbcCatalog
        - name: CATALOG_URI
          value: jdbc:postgresql://postgres.nda-platform.svc:5432/nda
        - name: CATALOG_JDBC_USER
          value: nda
        - name: CATALOG_WAREHOUSE
          value: s3://warehouse/
        - name: CATALOG_IO__IMPL
          value: org.apache.iceberg.aws.s3.S3FileIO
        - name: CATALOG_S3_ENDPOINT
          value: http://minio.nda-platform.svc:9000
        - name: CATALOG_S3_PATH__STYLE__ACCESS
          value: 'true'
        - name: AWS_REGION
          value: us-east-1
        - name: CATALOG_JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: CATALOG_JDBC_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /v1/config
            port: 8181
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /v1/config
            port: 8181
            scheme: HTTP
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: iceberg-rest
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: nda-platform
spec:
  selector:
    app: iceberg-rest
  ports:
  - name: rest
    port: 8181
    targetPort: 8181
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iceberg-rest
  namespace: nda-platform
spec:
  selector:
    matchLabels:
      app: iceberg-rest
  maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: nda-platform
  labels:
    app: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.3@sha256:29be7252db0a106f1cd2ac17b9a56ff2668073da645638a38b9fc67deeb2d6c4
        args:
        - start
        - --http-enabled=true
        - --http-port=8180
        - --hostname=http://nda-keycloak:8180
        - --hostname-backchannel-dynamic=true
        - --cache=ispn
        ports:
        - containerPort: 8180
        - containerPort: 9000
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://postgres.nda-platform.svc:5432/nda
        - name: KC_DB_USERNAME
          value: nda
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: JAVA_OPTS_KC_HEAP
          value: -Xms256m -Xmx768m
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: KC_DB_PASSWORD
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nda-secrets
              key: KEYCLOAK_ADMIN_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1200Mi
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
          timeoutSeconds: 5
          httpGet:
            path: /health/ready
            port: 9000
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
          httpGet:
            path: /health/live
            port: 9000
            scheme: HTTP
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: nda-platform
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8180
    targetPort: 8180
